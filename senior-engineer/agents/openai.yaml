interface:
  display_name: "Senior Engineer"
  short_description: "Evidence-gated coding: 小改/大改 first, then 窄/厚 tax, then A/B/C-lite/满配 C/D cells"
  default_prompt: "Use $senior-engineer. Classify 小改/大改 by the 8-item closed checklist — do not self-judge. Hits on 对外接口 / 钱 / 权限 / 对外配置 stay 大改 even for a one-line diff; 「改动面很小」「只改了一行」does not demote to 小改 or C-lite. After 大改, classify tax: 窄满配 only if the closed 窄清单 all hit (shape unchanged, no new dep, callers grep-closed); any miss or uncertainty → 厚满配. 窄满配 is not a new shape and not C-lite. 小改 = A/B/C-lite only. 窄满配 = 满配 encoding cells + diff-matched tests; no 五步, no subagent review, no seed/hook/Context7 asks, no unrelated full-suite tests or full-suite 红绿. 厚满配 = 满配 C, or D if new dep/catalog; subagent review; ask seed if no INDEX. 红绿 only for the contract test actually added/changed. Experience is optional: if docs/experience/INDEX.md exists, light-read it; if not, mark 不可用 and do not ask seed except on 厚满配. Do not own 自清洁 — that belongs to experience. Do not copy this skill into the repo unless the user says the repo must carry the rules. Evidence only for table cells (command + hits). Invariants have no exemption unless the user disabled the skill this turn."

policy:
  allow_implicit_invocation: true
