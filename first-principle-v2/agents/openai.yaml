interface:
  display_name: "First Principle"
  short_description: "Pin the object, decompose it into independently measurable parts, evaluate with independent yardsticks, find the real gap, reassemble. No step whose only warrant is analogy."
  default_prompt: "Use $first-principle-v2. Pin the object as the thing the falsifiable goal attaches to — never a candidate solution (microservice/platform/framework). Name the analogical baseline with a checkable source, or write none. Restate analogical goals as observable outcomes with no leftover means-words. Decompose the object into constituents or independently measurable properties. Fake-cut test: if a part cannot be named without current module/product/architecture words, it is a fake cut. Evaluate each part with an independent yardstick that yields a number or true/false: physical/logical constraint, contract, repeatable measurement, public factor price of the part itself, or user-confirmed source. Designer taste, best practice, industry benchmark, competitor numbers, and whole-pack price are analogical, not yardsticks. Unknown parts are not evaluated; if a path depends on them, the first verification must measure that unknown. Gap must be a checkable delta, not elegance. Forced vs free; extra paths that only change free choices do not count. Industry solutions may stay only if each step points back to facts. Output work-products not empty sections: (1) object, baseline, unverified assumptions (2) parts, yardsticks, readings, gap (3) forced vs free, path(s), premises (4) first verification that hits the claimed gap — what quantity, which side kills the proposal. Happened iff object is not a candidate; fake-cut, fake-yardstick, and fake-verification tests pass; no step warranted only by analogy; load-bearing facts sourced or unknown. Default is a design proposal, not code. Do not implement without authorization. Do not claim the skill caused first principles until an executor is seen stopping fake cuts/yardsticks/verifications."

policy:
  allow_implicit_invocation: true
