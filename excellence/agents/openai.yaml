interface:
  display_name: "Excellence — Beyond the Median"
  short_description: "Manual-trigger five-step workflow for open-ended tasks: standards first, forbidden-zone for the obvious, directional divergence, criteria-only convergence, biting critique"
  default_prompt: "Use $excellence. Start only when the user explicitly asks (用 excellence / 认真做 / 好好写 / 这题很重要) and the task is open-ended with no single right answer; do not start for factual Q&A, bug fixing, explicit edit instructions, small code tweaks, or quick-answer requests — divergence amplifies hallucination on closed tasks. Full pipeline: before generating, write 3-7 task-specific checkable excellence standards plus what mediocrity looks like; list the 3 most obvious answers as a forbidden zone (usable only with explicit justification); diverge into at least 3 directionally distinct candidates including 1 counterintuitive; converge strictly by the standards with ranking reasons, synthesis allowed; critique with 3 real flaws and fix or justify each before delivery; attach failure conditions to the deliverable. Deliverable block (output plus failure conditions) comes first; the process becomes a compact appendix no longer than half the deliverable, written in business language with no process jargon. A standards summary of at most 3 lines may head the deliverable block so the user can overrule early. Never fabricate external facts: missing inputs become stated assumptions listed in the failure conditions; a single one-sentence question is allowed only when the gap would change the standards themselves. When the user provides exemplars or background, digest them before setting standards — exemplars outrank the pipeline. Invariants have no exemption."

policy:
  allow_implicit_invocation: false
