interface:
  display_name: "Experience"
  short_description: "Cross-session memory: pitfalls, entries, decisions — record once, retrieve at decision points"
  default_prompt: "Use $experience only to write an entry, maintain/clean, explicit search, or seed/setup. Daily retrieval is the project short contract (and hook if installed), not this skill body. INDEX.md is a ledger of index lines, not a rules copy — seed it with the ledger template; put retrieval rules only in the short contract (schema 4). Instant 自清洁 belongs in the short contract so the daily path can run it; periodic 自清洁 is 维护 and must call this skill — do not copy the clean procedure into the short contract. Do not load this skill as a per-task startup ritual. allow_implicit_invocation is false; do not auto-inject this body. Hook injects ledger lines only, not INDEX process headers. Do not rewrite an existing fat INDEX unless the user agrees while upgrading schema. Card discipline: raw evidence in 现场 (verbatim errors, anchors, commands, numbers) and scenario-bound actions; synthesize high-level summaries at hit time; recurring cases extend the same card's 现场, and entry edits verify against every stored case before the gate; keyword cluster is a closed checklist — synonyms/aliases plus 1–2 user phrasings, missing parts fail the card."

policy:
  allow_implicit_invocation: false
