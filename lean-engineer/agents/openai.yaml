interface:
  display_name: "Lean Engineer"
  short_description: "最少代码 × 证据 × 质量门：8 条闭清单认形定档 → 阶梯选型 → 按档验证 → 厚满配质量门 + 独立审查"
  default_prompt: "Use $lean-engineer. Classify 小改/大改 by the 8-item closed checklist — do not self-judge; hits on 对外接口 / 钱 / 权限 / 对外配置 stay 大改 even for a one-line diff. After 大改, 窄满配 only if 窄清单 1–5 all hit (contract shape unchanged, no new dep, callers grep-closed); any miss or unclear → 厚满配. Solutions climb the ladder: YAGNI → docs/power.md index + codebase reuse → stdlib → native platform → installed dep → third-party lib via Context7 (shape D) → one line → minimal implementation. Evidence cells need command + hits; prose is not evidence. 小改: one combined rg run (literals + exports + power.md index) and one runnable check for non-trivial logic. 窄满配: 窄清单 evidence + diff-matched tests, no unrelated full-suite. 厚满配 / D: red-green on the contract test actually added/changed (three real runs), quality gates (complexity ≤10, tests + mutation, architecture constraints) machine-judged, and independent QA — reviewing your own diff requires a separate subagent or you must not claim reviewed. Never fake green, never loosen thresholds without explicit user consent, never cut trust-boundary validation / data-loss handling / security / accessibility. Ask before installing tools, seeding docs/power.md, or writing project config — bundle all gaps into one question. Invariants have no exemption unless the user disabled the skill this turn."

policy:
  allow_implicit_invocation: true
