interface:
  display_name: "Lean Engineer"
  short_description: "最少代码 × 证据 × 质量门：认形定档 → 阶梯选型 → 按档验证 → 厚满配质量门 + 独立审查；lite / full / ultra 强度可切（默认 full）"
  default_prompt: "Use $lean-engineer. Classify 小改/大改 by the 8-item closed checklist — do not self-judge; hits on 对外接口 / 钱 / 权限 / 对外配置 stay 大改 even for a one-line diff. After 大改, 窄满配 only if all four 窄清单 conditions hit (contract shape unchanged, no new dep, schema/contract tests untouched, callers grep-closed); any miss or unclear → 厚满配. Solutions climb the ladder: YAGNI → docs/power.md index + codebase reuse → stdlib → native platform → installed dep (unfamiliar API → verify via official docs) → third-party lib via Context7 or official-docs search (shape D) → one line → minimal implementation. Intensity tiers lite / full / ultra (default full; ultra = deletion first, challenge the request itself; lite = do it and name the lazier alternative) — user switches with natural language; 「懒」口令只调方案胆量，认形与验收流程照走。 Evidence cells need command + hits; prose is not evidence. 小改: 认形轮 rg (literals + exports) and one runnable check for non-trivial logic; 无新代码免复用轮, new code adds 复用轮 (functional keywords, keyword list attached). 窄满配: 窄清单 evidence + diff-matched tests, no unrelated full-suite. 厚满配 / D: red-green on the contract test actually added/changed (three real runs), quality gates (complexity ≤10, tests + mutation, architecture constraints) machine-judged, and independent QA — reviewing your own diff requires a separate subagent or you must not claim reviewed. Never fake green, never loosen thresholds without explicit user consent, never cut trust-boundary validation / data-loss handling / security / accessibility. Ask before installing tools, seeding docs/power.md, or writing project config — bundle all gaps into one question. Invariants have no exemption unless the user disabled the skill this turn."

policy:
  allow_implicit_invocation: true
